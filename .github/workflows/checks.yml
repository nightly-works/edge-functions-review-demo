name: checks
on: [push, pull_request]
jobs:
  attacks-and-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22.18+ runs TypeScript files directly, so the tests need no install step.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.ts
